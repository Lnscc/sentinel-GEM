name: sentinel-gem-vps

x-production: &production
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *production
    cpus: 0.75
    mem_limit: 1152m
    memswap_limit: 1152m
    ports: !reset []

  engine:
    <<: *production
    cpus: 1.25
    mem_limit: 2048m
    memswap_limit: 2048m
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx1280m -XX:MaxDirectMemorySize=96m -XX:ActiveProcessorCount=2}
    build: !reset null
    image: sentinel-gem-vps-engine:${DEPLOY_SHA:?Set DEPLOY_SHA}
    ports: !reset []

  monitor:
    <<: *production
    build: !reset null
    image: sentinel-gem-vps-monitor:${DEPLOY_SHA:?Set DEPLOY_SHA}
    # Both upstream ports already used by the host's Nginx.
    ports: !override
      - "127.0.0.1:4000:80"
      - "127.0.0.1:3000:80"
