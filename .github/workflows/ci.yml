name: CI

on:
  pull_request:
  push:
    branches: [main, deploy]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/deploy' }}

permissions:
  contents: read

jobs:
  engine-postgres-postman:
    name: Engine, PostgreSQL, Postman
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gne
      SPRING_DATASOURCE_USERNAME: gne
      SPRING_DATASOURCE_PASSWORD: gne
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: gne
          POSTGRES_USER: gne
          POSTGRES_PASSWORD: gne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gne -d gne"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: monitor/package-lock.json
      - name: Verify engine
        working-directory: engine
        run: bash mvnw -B verify
      - name: Run deterministic Postman contracts
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/sentinel-gem-engine-0.0.1-SNAPSHOT.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/gne \
            --spring.datasource.username=gne \
            --spring.datasource.password=gne \
            --spring.docker.compose.enabled=false \
            --gdelt.ingestion.enabled=false \
            --gdelt.staging.enabled=false \
            --gdelt.retention.enabled=false \
            --articles.enabled=false \
            --stories.embeddings.incremental.enabled=false \
            --stories.embeddings.repair.enabled=false \
            --stories.snapshots.incremental.enabled=false \
            > engine.log 2>&1 &
          engine_pid=$!
          trap 'kill "$engine_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent "http://localhost:8080/articles?limit=1" > /dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              cat engine.log
              exit 1
            fi
            sleep 1
          done

          npx --yes newman@6.2.1 run ../docs/postman/Article-API.postman_collection.json \
            --environment ../docs/postman/Local.postman_environment.json \
            --folder "Aggregationen" \
            --folder "Extraction Health" \
            --folder "Validierung"

          npx --yes newman@6.2.1 run ../docs/postman/Statistics-API.postman_collection.json \
            --environment ../docs/postman/Local.postman_environment.json \
            --env-var expectedVisibleVersionStatus=SHADOW

          npx --yes newman@6.2.1 run ../docs/postman/Explore-API.postman_collection.json \
            --environment ../docs/postman/Local.postman_environment.json \
            --env-var expectedVisibleVersionStatus=SHADOW

  monitor:
    name: Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: monitor/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: monitor-ui-failures
          path: monitor/test-results/

  container-build:
    name: Container build
    if: github.event_name != 'push' || github.ref != 'refs/heads/deploy'
    needs: [engine-postgres-postman, monitor]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --tag sentinel-gem-engine:ci engine
      - run: docker build --tag sentinel-gem-monitor:ci monitor

  diff-policy:
    name: Diff policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate diff and Postman JSON
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git rev-parse "$HEAD_SHA^")
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          for file in docs/postman/*.json; do
            python -m json.tool "$file" > /dev/null
          done

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          contract_files="$(printf '%s\n' "$changed_files" \
            | grep -E '^engine/src/main/java/.+/(api|query)/' \
            | grep -Ev 'QueryService\.java$' || true)"
          if [[ -n "$contract_files" ]] \
            && ! printf '%s\n' "$changed_files" \
              | grep -Eq '^docs/postman/[^/]+\.postman_collection\.json$'; then
            echo "REST API code changed without updating a Postman collection."
            printf '%s\n' "$contract_files"
            exit 1
          fi

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    needs: [engine-postgres-postman, monitor, diff-policy]
    environment: vps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build release images
        run: |
          docker build --label io.sentinel-gem.vps=true --tag "sentinel-gem-vps-engine:$GITHUB_SHA" engine
          docker build --label io.sentinel-gem.vps=true --tag "sentinel-gem-vps-monitor:$GITHUB_SHA" monitor
      - name: Transfer images and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_vps=(ssh -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o ConnectTimeout=10 "deploy@$VPS_HOST")

          "${ssh_vps[@]}" 'bash -se' <<'VPS_PREFLIGHT'
          docker image prune --all --force --filter label=io.sentinel-gem.vps=true
          available=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$available" -lt 10485760 ]; then
            echo "Deployment requires 10 GiB of free disk space." >&2
            exit 1
          fi
          VPS_PREFLIGHT
          docker image save "sentinel-gem-vps-engine:$GITHUB_SHA" "sentinel-gem-vps-monitor:$GITHUB_SHA" |
            gzip -1 | "${ssh_vps[@]}" 'bash -o pipefail -c "gzip -dc | docker image load"'
          "${ssh_vps[@]}" "bash -s -- $GITHUB_SHA" < deploy/vps.sh
